---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "pool_similar_components"
description: Pool similar families based on pairwise scores
keywords:
  - pooling
  - similarity
  - components
  - clustering
  - network
tools:
  - "pool_similar_components":
      description: "Pool similar families based on pairwise scores."
      homepage: "https://github.com/nf-core/proteinfamilies/tree/dev/modules/local/pool_similar_components/"
      documentation: "https://github.com/nf-core/proteinfamilies/tree/dev/modules/local/pool_similar_components/"
      tool_dev_url: "https://github.com/nf-core/proteinfamilies/tree/dev/modules/local/pool_similar_components/"
      doi: "10.5281/zenodo.14881993"
      licence: ["MIT"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - similarities:
        type: file
        description: CSV file containing pairwise similarities of families
        pattern: "*.csv"
        ontologies:
          - edam: "http://edamontology.org/format_3752" # CSV
output:
  pooled_components:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "pooled_components.txt":
          type: file
          description: Text file containing pooled similar components
          pattern: "pooled_components.txt"
          ontologies:
            - edam: "http://edamontology.org/format_2330" # Textual format
  versions_python:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - python:
          type: string
          description: The tool name
      - "python --version 2>&1 | sed 's/Python //'":
          type: eval
          description: The expression to obtain the version of python
  versions_pandas:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - pandas:
          type: string
          description: The tool name
      - 'python -c "import importlib.metadata; print(importlib.metadata.version(''pandas''))"':
          type: eval
          description: The expression to obtain the version of pandas
  versions_networkx:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - networkx:
          type: string
          description: The tool name
      - 'python -c "import importlib.metadata; print(importlib.metadata.version(''networkx''))"':
          type: eval
          description: The expression to obtain the version of networkx
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - "python --version 2>&1 | sed 's/Python //'":
          type: eval
          description: The expression to obtain the version of python
    - - ${task.process}:
          type: string
          description: The name of the process
      - pandas:
          type: string
          description: The name of the tool
      - 'python -c "import importlib.metadata; print(importlib.metadata.version(''pandas''))"':
          type: eval
          description: The expression to obtain the version of pandas
    - - ${task.process}:
          type: string
          description: The name of the process
      - networkx:
          type: string
          description: The name of the tool
      - 'python -c "import importlib.metadata; print(importlib.metadata.version(''networkx''))"':
          type: eval
          description: The expression to obtain the version of networkx
authors:
  - "@vagkaratzas"
maintainers:
  - "@vagkaratzas"
