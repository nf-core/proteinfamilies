# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "generate_families"
description: Generate family models and alignments from clustered sequences using multiple sequence alignment, trimming, HMM building, and optional sequence recruitment
keywords:
  - families
  - alignment
  - hmm
  - model
  - sequences
  - msa
  - trimming
  - recruitment
  - protein
components:
  - align_sequences
  - hmmer/hmmbuild
  - hmmer/hmmsearch
  - filter_recruited
  - hmmer/hmmalign
input:
  - sequences:
      type: file
      description: |
        Amino acid FASTA file containing sequences to be used for family generation
  - ch_fasta:
      type: file
      description: |
        FASTA files produced from the clustering process
  - alignment_tool:
      type: string
      description: |
        Tool to use for multiple sequence alignment
      enum: ["famsa", "mafft"]
  - skip_seed_msa_trimming:
      type: boolean
      description: |
        Skip trimming of seed multiple sequence alignments with ClipKIT
  - skip_recruiting:
      type: boolean
      description: |
        Skip additional sequence recruiting step using hmmsearch
  - recruit_min_model_coverage:
      type: number
      description: |
        Query length threshold for hmmsearch additional sequence filtering (between 0.0 and 1.0)
      minimum: 0.0
      maximum: 1.0
output:
  - versions:
      type: file
      description: |
        Versions file containing the software versions used in the workflow
  - seed_msa:
      type: file
      description: |
        Seed MSA files containing the multiple sequence alignment of the seed clusters
  - full_msa:
      type: file
      description: |
        Full MSA files containing the multiple sequence alignment of each family with additional recruited sequences
  - fasta:
      type: file
      description: |
        FASTA files corresponding to the full MSA files
  - hmm:
      type: file
      description: |
        HMM files containing the hidden Markov model of each family
authors:
  - "@vagkaratzas"
maintainers:
  - "@vagkaratzas"
