# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "update_families"
description: Update existing families with new sequences (and the members of their existing full MSAs) through homology search, then rebuild each family like a newly created one (new seed MSA, HMM and full MSA)
keywords:
  - update
  - families
  - hmm
  - model
  - alignment
  - msa
  - clustering
  - homology
  - search
  - recruitment
components:
  - untar
  - find/concatenate
  - gunzip
  - pool_existing_members
  - hmmer/hmmsearch
  - branch_hits_fasta
  - mmseqs_fasta_cluster
  - remove_redundant_seqs
  - generate_families
  - hmmer/hmmalign
  - extract_unassigned_seqs
  - extract_family_members
  - extract_family_reps
input:
  - ch_samplesheet_for_update:
      type: file
      description: |
        Channel with the following elements; meta, sequences, existing_hmms, existing_seed_msas, existing_full_msas.
        The MSA archives are optional ([]); their files are named after the HMM files. Full MSA members are
        searched again; seed MSAs are never searched, only passed through.
  - hmmsearch_query_length_threshold:
      type: number
      description: |
        Query length threshold for hmmsearch filtering to determine sequence hits that will update existing families (between 0.0 and 1.0)
      minimum: 0.0
      maximum: 1.0
  - skip_sequence_redundancy_removal:
      type: boolean
      description: |
        Skip sequence redundancy removal step using clustering
  - clustering_tool:
      type: string
      description: |
        Tool to use for sequence clustering to remove redundancy
      enum: ["linclust", "cluster"]
  - alignment_tool:
      type: string
      description: |
        Tool to use for multiple sequence alignment
      enum: ["famsa", "mafft"]
  - skip_seed_msa_trimming:
      type: boolean
      description: |
        Skip trimming of the new seed MSAs with ClipKIT
  - hmmsearch_write_target:
      type: boolean
      description: |
        Write target sequences in the recruiting hmmsearch output
  - hmmsearch_write_domain:
      type: boolean
      description: |
        Write domain information in the recruiting hmmsearch output
  - skip_additional_sequence_recruiting:
      type: boolean
      description: |
        Skip recruiting the full MSA with the new HMM; the new seed MSA is then also the full MSA
  - skip_update_refinement:
      type: boolean
      description: |
        Keep the existing HMMs, which align their hits into the new full MSAs; provided seed MSAs pass through unchanged
output:
  - seed_msa:
      type: file
      description: |
        New seed MSA per rebuilt family; the provided seed MSA of every other family
  - full_msa:
      type: file
      description: |
        New full MSA per returned family; the provided full MSA of every kept family
  - fasta:
      type: file
      description: |
        Sequences of each returned family's full MSA
  - hmm:
      type: file
      description: |
        New HMM per rebuilt family; the existing HMM of every other family
  - kept_families:
      type: list
      description: |
        [family, reason] of each existing family the update did not return (kept unchanged), per sample;
        reason "no hits" or "no recruits" (the rebuilt HMM recruited nothing)
  - no_hit_seqs:
      type: file
      description: |
        Gzipped FASTA of the input sequences in no returned family, to go through the base family generation workflow
  - updated_family_reps:
      type: file
      description: |
        A MultiQC CSV file containing metadata about the updated family representatives;
        "Sample Name","Family Id","Size","Representative Length","Representative Id","Sequence"
authors:
  - "@vagkaratzas"
maintainers:
  - "@vagkaratzas"
