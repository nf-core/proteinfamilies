# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "chunk_and_generate_families"
description: Chunk a sample's clusters and generate family models from them with the selected algorithm, either the standard alignment and HMM building chain or the iterative mgnifam one
keywords:
  - families
  - clusters
  - chunking
  - alignment
  - hmm
  - model
  - protein
components:
  - chunk_clusters
  - generate_families
  - generate_families_iteratively
input:
  - sequences:
      type: file
      description: |
        Amino acid FASTA file holding the clustered sequence pool
  - clusters:
      type: file
      description: |
        2-column TSV clustering file (cluster representative and cluster member)
  - family_generation_algorithm:
      type: string
      description: |
        Algorithm used to build the family models. 'standard' aligns each cluster and builds
        one HMM per task; 'iterative' hands whole chunks of clusters to mgnifam, which loops
        HMM building, recruitment and realignment until each family converges or is discarded.
      enum: ["standard", "iterative"]
      default: "standard"
  - cluster_size_threshold:
      type: integer
      description: |
        Minimum cluster size to keep; smaller clusters are discarded before chunking
  - clusters_per_chunk:
      type: integer
      description: |
        Clusters per chunk in the iterative algorithm. The standard algorithm always chunks one cluster per file.
  - alignment_tool:
      type: string
      description: |
        Tool to use for multiple sequence alignment. Standard algorithm only.
      enum: ["famsa", "mafft"]
  - skip_msa_trimming:
      type: boolean
      description: |
        Skip trimming of multiple sequence alignments with ClipKIT. Standard algorithm only.
  - clipkit_out_format:
      type: string
      description: |
        Output format for ClipKIT trimming tool. Standard algorithm only.
      default: "clipkit"
  - hmmsearch_write_target:
      type: boolean
      description: |
        Write target sequences in hmmsearch output. Standard algorithm only.
  - hmmsearch_write_domain:
      type: boolean
      description: |
        Write domain information in hmmsearch output. Standard algorithm only.
  - skip_additional_sequence_recruiting:
      type: boolean
      description: |
        Skip additional sequence recruiting step using hmmsearch. Standard algorithm only.
  - hmmsearch_query_length_threshold:
      type: number
      description: |
        Query length threshold for hmmsearch additional sequence filtering (between 0.0 and 1.0)
      minimum: 0.0
      maximum: 1.0
output:
  - versions:
      type: file
      description: |
        Versions file containing the software versions used in the workflow
  - seed_msa:
      type: file
      description: |
        Seed MSA files containing the multiple sequence alignment of the seed clusters
  - full_msa:
      type: file
      description: |
        Full MSA files containing the multiple sequence alignment of each family with additional recruited sequences
  - fasta:
      type: file
      description: |
        FASTA files corresponding to the full MSA files
  - hmm:
      type: file
      description: |
        HMM files containing the hidden Markov model of each family
authors:
  - "@vagkaratzas"
maintainers:
  - "@vagkaratzas"
